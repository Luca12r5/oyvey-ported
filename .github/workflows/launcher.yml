name: LEGO Launcher (Windows)

on:
  push:
    branches: ['**']
    # Path filters are not evaluated for tag pushes, so release tags always build.
    tags:
      - 'launcher-v*'
    paths:
      - 'apps/launcher/**'
      - 'packages/shared/**'
      - '.github/workflows/launcher.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w apps/launcher
      - run: npm test -w apps/launcher
      - name: Electron UI test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          npm run build -w apps/launcher
          cd apps/launcher && xvfb-run -a node --disable-warning=ExperimentalWarning test/ui.e2e.mjs

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      # write is only used to publish releases for launcher-v* tags
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build installer
        env:
          LEGO_MS_CLIENT_ID: ${{ secrets.LEGO_MS_CLIENT_ID }}
          LEGO_BACKEND_URL: ${{ vars.LEGO_BACKEND_URL }}
          LEGO_CURSEFORGE_KEY: ${{ secrets.LEGO_CURSEFORGE_KEY }}
          # Option A: classic code signing certificate (.pfx, base64) – see docs/CODE-SIGNING.md
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Option B: Azure Trusted Signing
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          SIGN_PUBLISHER: ${{ vars.SIGN_PUBLISHER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          args=()
          if [ -n "$AZURE_SIGN_ENDPOINT" ] && [ -n "$AZURE_CLIENT_SECRET" ]; then
            echo "Signing with Azure Trusted Signing"
            args+=(-c.win.azureSignOptions.endpoint="$AZURE_SIGN_ENDPOINT" -c.win.azureSignOptions.codeSigningAccountName="$AZURE_SIGN_ACCOUNT" -c.win.azureSignOptions.certificateProfileName="$AZURE_SIGN_PROFILE" -c.win.azureSignOptions.publisherName="$SIGN_PUBLISHER")
            unset CSC_LINK CSC_KEY_PASSWORD
          elif [ -n "$CSC_LINK" ]; then
            echo "Signing with code signing certificate"
            [ -n "$SIGN_PUBLISHER" ] && args+=(-c.win.signtoolOptions.publisherName="$SIGN_PUBLISHER")
          else
            echo "::warning::Unsigned build – Windows SmartScreen and some antivirus products may warn (docs/CODE-SIGNING.md)."
            export CSC_IDENTITY_AUTO_DISCOVERY=false; unset CSC_LINK CSC_KEY_PASSWORD
          fi
          publish=never
          if [[ "$GITHUB_REF" == refs/tags/launcher-v* ]]; then
            want="${GITHUB_REF#refs/tags/launcher-v}"
            have=$(node -p "require('./apps/launcher/package.json').version")
            if [ "$want" != "$have" ]; then echo "::error::Tag version $want does not match package.json $have"; exit 1; fi
            publish=always
          fi
          npm run build -w apps/launcher
          cd apps/launcher && npx electron-builder --win --x64 --publish "$publish" "${args[@]}"
      - name: Checksums
        shell: pwsh
        run: Get-ChildItem apps/launcher/release/*.exe | Get-FileHash -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: lego-launcher-windows
          path: |
            apps/launcher/release/*.exe
            apps/launcher/release/*.blockmap
            apps/launcher/release/latest.yml
          if-no-files-found: error
          retention-days: 30
