name: LEGO Launcher

on:
  push:
    branches: ['**']
    tags:
      - 'launcher-v*'
    paths:
      - 'apps/launcher/**'
      - 'packages/shared/**'
      - 'lego-client/**'
      - 'lego-client-26/**'
      - '.github/workflows/launcher.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w apps/launcher
      - run: npm test -w apps/launcher
      - name: Electron UI test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          npm run build -w apps/launcher
          cd apps/launcher && xvfb-run -a node --disable-warning=ExperimentalWarning test/ui.e2e.mjs

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build LEGO client
        shell: bash
        run: |
          ./gradlew -p lego-client build -x test --no-daemon
          jar=$(ls lego-client/build/libs/legoclient-*.jar | grep -v -- '-sources' | head -1)
          cp "$jar" apps/launcher/resources/legoclient.jar
          ls -la apps/launcher/resources
      # LEGO Client for Minecraft 26.3 (Java 25, Gradle 9.7). Shipped as soon as it builds;
      # the launcher only offers versions whose jar is in the installer.
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build LEGO client 26.3
        continue-on-error: true
        shell: bash
        run: |
          gradle -p lego-client-26 build -x test --no-daemon --console=plain -q
          jar=$(ls lego-client-26/build/libs/legoclient-*.jar | grep -v -- '-sources' | head -1)
          cp "$jar" apps/launcher/resources/legoclient-26.3.jar
          ls -la apps/launcher/resources
      - name: Build installer
        env:
          LEGO_MS_CLIENT_ID: ${{ secrets.LEGO_MS_CLIENT_ID }}
          LEGO_BACKEND_URL: ${{ vars.LEGO_BACKEND_URL }}
          LEGO_CURSEFORGE_KEY: ${{ secrets.LEGO_CURSEFORGE_KEY }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          SIGN_PUBLISHER: ${{ vars.SIGN_PUBLISHER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          args=()
          if [ -n "$AZURE_SIGN_ENDPOINT" ] && [ -n "$AZURE_CLIENT_SECRET" ]; then
            echo "Signing with Azure Trusted Signing"
            args+=(-c.win.azureSignOptions.endpoint="$AZURE_SIGN_ENDPOINT" -c.win.azureSignOptions.codeSigningAccountName="$AZURE_SIGN_ACCOUNT" -c.win.azureSignOptions.certificateProfileName="$AZURE_SIGN_PROFILE" -c.win.azureSignOptions.publisherName="$SIGN_PUBLISHER")
            unset CSC_LINK CSC_KEY_PASSWORD
          elif [ -n "$CSC_LINK" ]; then
            echo "Signing with code signing certificate"
            [ -n "$SIGN_PUBLISHER" ] && args+=(-c.win.signtoolOptions.publisherName="$SIGN_PUBLISHER")
          else
            echo "::warning::Unsigned build – Windows SmartScreen may warn (docs/CODE-SIGNING.md)."
            export CSC_IDENTITY_AUTO_DISCOVERY=false; unset CSC_LINK CSC_KEY_PASSWORD
          fi
          publish=never
          if [[ "$GITHUB_REF" == refs/tags/launcher-v* ]]; then
            want="${GITHUB_REF#refs/tags/launcher-v}"
            have=$(node -p "require('./apps/launcher/package.json').version")
            if [ "$want" != "$have" ]; then echo "::error::Tag version $want does not match package.json $have"; exit 1; fi
            publish=always
          fi
          npm run build -w apps/launcher
          cd apps/launcher && npx electron-builder --win --x64 --publish "$publish" "${args[@]}"
      - name: Checksums
        shell: pwsh
        run: Get-ChildItem apps/launcher/release/*.exe | Get-FileHash -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: lego-launcher-windows
          path: |
            apps/launcher/release/*.exe
            apps/launcher/release/*.blockmap
            apps/launcher/release/latest.yml
          if-no-files-found: error
          retention-days: 30

  macos:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build LEGO client
        run: |
          ./gradlew -p lego-client build -x test --no-daemon
          jar=$(ls lego-client/build/libs/legoclient-*.jar | grep -v -- '-sources' | head -1)
          cp "$jar" apps/launcher/resources/legoclient.jar
      - name: Build installer
        env:
          LEGO_MS_CLIENT_ID: ${{ secrets.LEGO_MS_CLIENT_ID }}
          LEGO_BACKEND_URL: ${{ vars.LEGO_BACKEND_URL }}
          LEGO_CURSEFORGE_KEY: ${{ secrets.LEGO_CURSEFORGE_KEY }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          publish=never
          if [[ "$GITHUB_REF" == refs/tags/launcher-v* ]]; then
            want="${GITHUB_REF#refs/tags/launcher-v}"
            have=$(node -p "require('./apps/launcher/package.json').version")
            if [ "$want" != "$have" ]; then echo "::error::Tag version $want does not match package.json $have"; exit 1; fi
            publish=always
          fi
          npm run build -w apps/launcher
          cd apps/launcher && npx electron-builder --mac --x64 --arm64 --publish "$publish"
      - name: Checksums
        run: shasum -a 256 apps/launcher/release/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: lego-launcher-macos
          path: |
            apps/launcher/release/*.dmg
            apps/launcher/release/*.blockmap
            apps/launcher/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 30

  linux:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build LEGO client
        run: |
          ./gradlew -p lego-client build -x test --no-daemon
          jar=$(ls lego-client/build/libs/legoclient-*.jar | grep -v -- '-sources' | head -1)
          cp "$jar" apps/launcher/resources/legoclient.jar
      - name: Build installer
        env:
          LEGO_MS_CLIENT_ID: ${{ secrets.LEGO_MS_CLIENT_ID }}
          LEGO_BACKEND_URL: ${{ vars.LEGO_BACKEND_URL }}
          LEGO_CURSEFORGE_KEY: ${{ secrets.LEGO_CURSEFORGE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          publish=never
          if [[ "$GITHUB_REF" == refs/tags/launcher-v* ]]; then
            want="${GITHUB_REF#refs/tags/launcher-v}"
            have=$(node -p "require('./apps/launcher/package.json').version")
            if [ "$want" != "$have" ]; then echo "::error::Tag version $want does not match package.json $have"; exit 1; fi
            publish=always
          fi
          npm run build -w apps/launcher
          cd apps/launcher && npx electron-builder --linux --x64 --publish "$publish"
      - name: Checksums
        run: sha256sum apps/launcher/release/*.AppImage apps/launcher/release/*.deb 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: lego-launcher-linux
          path: |
            apps/launcher/release/*.AppImage
            apps/launcher/release/*.deb
            apps/launcher/release/latest-linux.yml
          if-no-files-found: error
          retention-days: 30

  # Newest build of the development branch as a public pre-release, so the exe can be
  # downloaded without a GitHub login (artifacts need one). Always the same link:
  # https://github.com/<owner>/<repo>/releases/tag/launcher-nightly
  nightly:
    needs: [windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/lego-launcher-overhaul-ibsf6r'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: launcher-nightly
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lego-launcher-windows
          path: win
      - name: Publish pre-release launcher-nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la win
          gh release delete launcher-nightly --yes --cleanup-tag || true
          gh release create launcher-nightly win/*.exe \
            --prerelease --target "$GITHUB_SHA" \
            --title "LEGO Launcher (neueste Version)" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7} am $(date -u '+%d.%m.%Y %H:%M') UTC. Windows: die .exe herunterladen und starten."
