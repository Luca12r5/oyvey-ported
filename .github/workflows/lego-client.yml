name: LEGO client

on:
  push:
    paths:
      - 'lego-client/**'
      - '.github/workflows/lego-client.yml'
  pull_request:
    paths:
      - 'lego-client/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew -p lego-client build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: legoclient
          path: lego-client/build/libs/
          if-no-files-found: error
          retention-days: 30
