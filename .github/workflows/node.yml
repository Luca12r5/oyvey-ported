name: Backend, website and shared

on:
  push:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/node.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Website icons in sync with the launcher
        run: node apps/website/tools/sync-icons.mjs --check
      - name: Website end-to-end (Chromium)
        run: |
          npx playwright-core install chromium
          CHROMIUM_PATH=$(node -e "console.log(require('playwright-core').chromium.executablePath())") npm run e2e
