# LEGO Client for Minecraft 26.3: shared code from lego-client/ plus the 26.3 overlay in
# lego-client-26/. The compile errors are summarised in the log (this is the port's loop).
name: LEGO client 26.3

on:
  push:
    paths:
      - 'lego-client/src/main/**'
      - 'lego-client-26/**'
      - '.github/workflows/lego-client-26.yml'
      - 'apps/launcher/test/real-launch.ts'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build
        run: |
          set -o pipefail
          gradle -p lego-client-26 build -x test --no-daemon --console=plain 2>&1 | tee build.log || {
            echo "::group::error summary"
            grep -E '^/.+\.java:[0-9]+: error:' build.log | sed -E 's#.*/merged/java/##' | sed -E 's/:[0-9]+: error:/: /' | sort | uniq -c | sort -rn | head -150
            echo "::endgroup::"
            echo "==== ERROR LIST"
            # file:line: message | source line (each error once)
            awk '/\.java:[0-9]+: error:/ { sub(/.*\/merged\/java\//, ""); e=$0; getline src; gsub(/^[ \t]+/, "", src); if (!(e in seen)) { seen[e]=1; print e " | " src } }' build.log | head -900
            echo "ERRORS: $(grep -cE '\.java:[0-9]+: error:' build.log)"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: legoclient-26.3
          path: lego-client-26/build/libs/
          if-no-files-found: error
          retention-days: 30

  # Really starts 26.3 with the jar from this build (software GL under xvfb) and waits for the title screen.
  launch:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 26.3 Fabric + LEGO Client
            args: --version 26.3 --loader fabric --lego legoclient.jar --session-test
          - name: 26.3 Fabric + LEGO Client + Vivecraft
            args: --version 26.3 --loader fabric --lego legoclient.jar --mods vivecraft
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: legoclient-26.3
          path: jar
      - name: Pick mod jar
        run: cp "$(ls jar/*.jar | grep -v -- '-sources' | head -1)" apps/launcher/legoclient.jar
      - name: Display libraries
        # apt mirrors sometimes stall: each try gets 4 minutes, three tries.
        timeout-minutes: 13
        run: |
          for i in 1 2 3; do
            timeout 240 sh -c 'sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-vulkan-drivers libvulkan1 x11-xserver-utils libxxf86vm1 libxrandr2 libxcursor1 libxi6 libxtst6 imagemagick > /dev/null' && exit 0
            echo "apt try $i failed, retrying"; sleep 5
          done
          exit 1
      - name: Install and start Minecraft
        timeout-minutes: 15
        working-directory: apps/launcher
        run: xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX +render -noreset" node --disable-warning=ExperimentalWarning test/real-launch.ts ${{ matrix.args }}
