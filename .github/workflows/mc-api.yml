# API explorer for the LEGO Client port to a new Minecraft version: answers the queries in
# tools/mcapi/query.txt with class lists and javap output from the real game + Fabric API jars.
name: MC API explorer

on:
  push:
    paths: ['tools/mcapi/query.txt', '.github/workflows/mc-api.yml']
  workflow_dispatch:

jobs:
  explore:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Classpath
        run: gradle -p lego-client-26 printClasspath --no-daemon --console=plain -q | grep '^CP ' | sed 's/^CP //' > cp.txt && wc -l cp.txt && grep -iE 'minecraft|fabric-api|blaze|renderpearl|lwjgl|sdl' cp.txt | head -40
      - name: Vivecraft jar (for VR test settings)
        run: |
          url=$(curl -fsSL 'https://api.modrinth.com/v2/project/vivecraft/version?game_versions=%5B%2226.3%22%5D&loaders=%5B%22fabric%22%5D' | jq -r '.[0].files[0].url')
          echo "vivecraft: $url"
          curl -fsSL -o vivecraft.jar "$url" && ls -la vivecraft.jar
          mkdir -p vive && (cd vive && unzip -q ../vivecraft.jar) || true
          echo "$PWD/vivecraft.jar" >> cp.txt
      - name: Queries
        run: |
          while read -r jar; do [ -f "$jar" ] && unzip -Z1 "$jar" 2>/dev/null | grep '\.class$' | sed "s#^#$jar|#"; done < cp.txt > classes.txt
          wc -l classes.txt
          CP=$(paste -sd: cp.txt)
          grep -vE '^\s*(#|$)' tools/mcapi/query.txt | while read -r kind arg; do
            echo "================ $kind $arg"
            case "$kind" in
              pkg) cut -d'|' -f2 classes.txt | grep -iE "${arg#(?i)}" | grep -v '\$[0-9]' | sed 's/\.class$//' | sort -u | head -400 ;;
              class) javap -public -cp "$CP" "$arg" 2>&1 | head -400 ;;
              classgrep) c=${arg%% *}; re=${arg#* }; javap -p -cp "$CP" "$c" 2>&1 | grep -iE -- "${re#(?i)}" | head -200 ;;
              vivestr) re=${arg#(?i)}; grep -rlaiE -- "$re" vive | head -40; grep -rhaoiE -- "[A-Za-z0-9_.:-]{0,40}($re)[A-Za-z0-9_.:-]{0,40}" vive | sort -u | head -80 ;;
              mcfile) while read -r jar; do [ -f "$jar" ] && unzip -Z1 "$jar" 2>/dev/null | grep -E -- "$arg" | head -8 | while read -r e; do echo "--- $jar!$e"; unzip -p "$jar" "$e" | head -c 3000; echo; done; done < cp.txt | head -300 ;;
              vivefile) find vive -iname "$arg" | head -20 | while read -r f; do echo "--- $f"; head -c 4000 "$f"; echo; done ;;
              code) c=${arg%% *}; m=${arg#* }; javap -c -p -constants -cp "$CP" "$c" 2>&1 | awk -v m="$m" '$0 ~ m {p=1} p {print; n++} p && /^$/ {p=0} n>400 {exit}' ;;
              codex) c=${arg%% *}; m=${arg#* }; javap -c -p -constants -cp "$CP" "$c" 2>&1 | awk -v m="$m" 'index($0, m) {p=1} p {print; n++} p && /^$/ {p=0} n>3000 {exit}' ;;
              consts) javap -p -constants -cp "$CP" "$arg" 2>&1 | grep -E 'static final int' | head -200 ;;
              grep) cut -d'|' -f2 classes.txt | grep -E '^(net/minecraft|com/mojang)/' | grep -v '\$' | sed 's/\.class$//;s#/#.#g' | while read -r c; do javap -p -cp "$CP" "$c" 2>/dev/null | grep -E "$arg" | sed "s#^#$c: #"; done | head -200 ;;
            esac
          done
