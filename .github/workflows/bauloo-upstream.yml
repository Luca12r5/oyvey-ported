# Bauloo Styles import: compiles the recovered source (tools/bauloo-upstream,
# intermediary names), remaps the jar to Mojang names and decompiles it in exactly the style
# of lego-client/ (same Vineflower settings as restore-lego-sources.yml). The result is
# published on ci/bauloo-decompiled, ready to copy into lego-client/.
name: Bauloo Styles source

on:
  push:
    paths:
      - 'tools/bauloo-upstream/**'
      - '.github/workflows/bauloo-upstream.yml'
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Bauloo source (intermediary)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew -p tools/bauloo-upstream jar --no-daemon --console=plain 2>&1 | tee build.log || {
            echo "==== ERROR LIST"
            grep -E '\.java:[0-9]+: error:' build.log | sed -E 's#.*/src/main/java/##' | head -300
            exit 1
          }
          find tools/bauloo-upstream/build -name '*.jar' -ls
      - name: Remap to Mojang names
        run: |
          # Loom's dev jar: compiled against intermediary names, which is the runtime namespace.
          JAR=$(find tools/bauloo-upstream/build -name '*.jar' ! -name '*sources*' | head -1)
          echo "jar: $JAR"
          # restore-lego finds the remapped mod jar by "legoclient" in its file name.
          cp "$JAR" "$RUNNER_TEMP/legoclient-bauloo.jar"
          ./gradlew -p tools/restore-lego remapLego -PlegoJar="$RUNNER_TEMP/legoclient-bauloo.jar" --no-daemon --console=plain
      - name: Decompile
        run: tools/restore-lego/decompile.sh
      - name: Publish to ci/bauloo-decompiled
        run: |
          set -e
          SRC=tools/restore-lego/build/decompiled
          DEST=$(mktemp -d)
          cp -r "$SRC"/. "$DEST"/
          cd "$DEST"
          git init -q
          git checkout -q -b ci/bauloo-decompiled
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Decompiled Bauloo Styles source (Mojang names) from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci/bauloo-decompiled
