name: Duelcliping

on:
  push:
    paths:
      - 'Duelcliping/**'
      - '.github/workflows/duelcliping.yml'
  workflow_dispatch:

jobs:
  core-tests-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Duelcliping
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test core (real ffmpeg pipelines)
        run: dotnet test tests/Duelcliping.Core.Tests -c Release --logger "console;verbosity=normal"

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: Duelcliping
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Fetch ffmpeg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-ffmpeg.ps1
      - name: Show capture filter options of the bundled ffmpeg
        run: |
          third_party\ffmpeg\ffmpeg.exe -hide_banner -h filter=scale_d3d11
          third_party\ffmpeg\ffmpeg.exe -hide_banner -h filter=ddagrab
          third_party\ffmpeg\ffmpeg.exe -hide_banner -h encoder=h264_nvenc | Select-String -Pattern "Supported pixel formats|d3d11"
          third_party\ffmpeg\ffmpeg.exe -hide_banner -h encoder=h264_amf | Select-String -Pattern "Supported pixel formats|d3d11"
          third_party\ffmpeg\ffmpeg.exe -hide_banner -h encoder=h264_qsv | Select-String -Pattern "Supported pixel formats|d3d11"
      - name: Test core on Windows (named pipes, WASAPI-format audio pump, remux)
        run: |
          $env:PATH = "$PWD\third_party\ffmpeg;$env:PATH"
          dotnet test tests/Duelcliping.Core.Tests -c Release --logger "console;verbosity=normal"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build, publish and create installer
        run: ./scripts/build.ps1 -SkipTests -Version "1.0.${{ github.run_number }}"
      - name: UI self-test (renders every page, opens the cutter, detects encoders)
        run: |
          $p = Start-Process -FilePath "artifacts\publish\Moments.exe" -ArgumentList "--selftest","$PWD\selftest.txt" -PassThru -Wait
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
      - name: Print UI screenshot luminance maps (layout review without artifact access)
        if: always()
        run: |
          Add-Type -AssemblyName System.Drawing
          $ramp = " .:-=+*#%@"
          Get-ChildItem screenshots -Filter "Dark-*.png" | Where-Object { $_.BaseName -in @('Dark-Dashboard','Dark-Library','Dark-Editor') } | ForEach-Object {
            $img = New-Object System.Drawing.Bitmap $_.FullName
            Write-Output "MAP $($_.BaseName) $($img.Width)x$($img.Height)"
            $cols = 110; $rows = 40
            for ($r = 0; $r -lt $rows; $r++) {
              $line = ""
              for ($c = 0; $c -lt $cols; $c++) {
                $x = [int](($c + 0.5) * $img.Width / $cols); $y = [int](($r + 0.5) * $img.Height / $rows)
                $p = $img.GetPixel($x, $y)
                $l = (0.2126 * $p.R + 0.7152 * $p.G + 0.0722 * $p.B) / 255
                $line += $ramp[[Math]::Min(9, [int]($l * 12))]
              }
              Write-Output ("|" + $line + "|")
            }
            $img.Dispose()
          }
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Moments-Screenshots
          path: Duelcliping/screenshots/
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Moments-Setup
          path: Duelcliping/artifacts/Moments-Setup-*.exe
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: Moments-Portable
          path: Duelcliping/artifacts/publish/
