<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34343a"/>
      <stop offset="1" stop-color="#1b1b1f"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e7ec"/>
    </linearGradient>
    <linearGradient id="stud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eeeff3"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="22"/>
      <feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="222" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <!-- 2x1 brick -->
  <g filter="url(#shadow)">
    <path d="M296 450 V386 a28 28 0 0 1 28 -28 H414 a28 28 0 0 1 28 28 V450 Z" fill="url(#stud)"/>
    <path d="M582 450 V386 a28 28 0 0 1 28 -28 H700 a28 28 0 0 1 28 28 V450 Z" fill="url(#stud)"/>
    <rect x="236" y="436" width="552" height="290" rx="38" fill="url(#body)"/>
  </g>
  <!-- soft edge under the studs so they read as separate parts -->
  <rect x="296" y="436" width="146" height="8" rx="4" fill="#000" opacity=".06"/>
  <rect x="582" y="436" width="146" height="8" rx="4" fill="#000" opacity=".06"/>
</svg>
