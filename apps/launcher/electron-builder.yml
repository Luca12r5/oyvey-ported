# Windows installer + updater metadata for the LEGO Launcher.
# Build: npm run dist:win -w apps/launcher  (CI: .github/workflows/launcher.yml)
appId: dev.lego.launcher
productName: LEGO Launcher
copyright: LEGO Launcher contributors
directories:
  output: release
  # App icon (icon.svg is the source; icon.png/.ico are rendered from it).
  buildResources: buildres
files:
  - dist/**/*
  - package.json
  - buildres/icon.png
  - "!dist/**/*.map"
asar: true
# The LEGO client mod built by CI (lego-client) ships with the installer.
extraResources:
  - from: resources
    to: .
    filter: ['*.jar']
win:
  target:
    - target: nsis
      arch: [x64]
  # Signing (certificate or Azure Trusted Signing) is configured by CI, see
  # docs/CODE-SIGNING.md. Unsigned builds work but can trigger SmartScreen.
  artifactName: LEGO-Launcher-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LEGO Launcher
  # Keep user data (settings, worlds) on uninstall unless the user removes it.
  deleteAppDataOnUninstall: false
  differentialPackage: true
publish:
  provider: github
  owner: Luca12r5
  repo: oyvey-ported
  releaseType: release
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: LEGO-Launcher-${version}-${arch}.${ext}
  category: public.app-category.games
  darkModeSupport: true
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: LEGO-Launcher-${version}.${ext}
  category: Game
  synopsis: Minecraft launcher with mod support
  executableName: lego-launcher
  maintainer: LEGO Launcher contributors
