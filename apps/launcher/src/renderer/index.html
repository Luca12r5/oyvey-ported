<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://cdn.modrinth.com; font-src 'self'; connect-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>LEGO Launcher</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <canvas id="bg" class="bg-canvas" aria-hidden="true"></canvas>
  <header class="titlebar">
    <div class="tb-left"><span id="tbLogo"></span><span class="wordmark">LEGO<b>LAUNCHER</b></span><span class="tb-sub" id="tbVersion"></span></div>
    <div class="tb-right">
      <div id="tbCoins" class="tb-coins" hidden></div>
      <div class="acct" id="acct"></div>
      <div class="win" id="win"></div>
    </div>
  </header>
  <div class="shell">
    <nav class="rail" id="sidebar" aria-label="Navigation"></nav>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <dialog id="dialog" class="dialog"></dialog>
</body>
</html>
