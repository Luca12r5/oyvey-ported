// LEGO Client for Minecraft 26.3 (Fabric, unobfuscated game, Java 25).
// The code is shared with ../lego-client (1.21.11): this build merges ../lego-client/src/main
// with this project's src/main, where a file here replaces the shared one of the same path.
// Only what really differs between the versions lives here.
// Build: gradle -p lego-client-26 build   (Gradle 9.7+, JDK 25)
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

def shared = file('../lego-client/src/main')
def overlay = file('src/main')
def merged = layout.buildDirectory.dir('merged').get().asFile

// Mechanical renames for the shared sources (see rewrite.rules).
def rules = file('rewrite.rules').readLines().findAll { it.trim() && !it.trim().startsWith('#') }.collect { line ->
    def cond = null
    def rest = line
    if (line.startsWith('if ')) {
        def i = line.indexOf(' :: ')
        cond = java.util.regex.Pattern.compile(line.substring(3, i))
        rest = line.substring(i + 4)
    }
    def parts = rest.split(' ==> ', 2)
    [cond: cond, re: java.util.regex.Pattern.compile(parts[0].trim()), to: parts[1]]
}
def rewrite = { String text ->
    rules.each { r -> if (r.cond == null || r.cond.matcher(text).find()) text = r.re.matcher(text).replaceAll(r.to) }
    text
}

def mergeSources = tasks.register('mergeSources', Sync) {
    inputs.file('rewrite.rules')
    into merged
    ['java', 'resources'].each { kind ->
        from(new File(shared, kind)) {
            into kind
            exclude { FileTreeElement e -> !e.directory && new File(overlay, "$kind/${e.relativePath.pathString}").exists() }
            // Written against the 1.21.11 blaze3d/item renderer API; HandEffect has a 26.3 stand-in in the overlay.
            exclude 'dev/lego/visual/shader/**', 'dev/lego/mixin/GlintMixin.java', 'dev/lego/mixin/HeldItemRendererMixin.java'
            // Bauloo Styles: the overlay has the author's 26.2 build (de/bauloo); assets and packs are shared.
            exclude 'de/bauloo/**'
        }
        from(new File(overlay, kind)) { into kind }
    }
    // Shared files (not the overlay's own) get the mechanical renames.
    doLast {
        def javaDir = new File(merged, 'java')
        def changed = 0
        javaDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (!f.name.endsWith('.java')) return
            def rel = javaDir.toPath().relativize(f.toPath()).toString()
            if (new File(overlay, "java/$rel").exists()) return
            def t = f.getText('UTF-8')
            def n = rewrite(t)
            if (n != t) { f.setText(n, 'UTF-8'); changed++ }
        }
        println "rewrite.rules changed ${changed} shared files"
        // 26.3 compiles post shaders with separate shader objects (also for Vulkan): inputs and
        // outputs need explicit locations.
        def shaders = 0
        // The Visor shaders also include the vanilla blocks the 26.3 way (#include instead of #moj_import).
        ['legoclient', 'visor', 'bauloo_styles'].each { ns ->
            def shaderDir = new File(merged, "resources/assets/${ns}/shaders")
            if (shaderDir.exists()) shaderDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                if (!(f.name.endsWith('.fsh') || f.name.endsWith('.vsh'))) return
                def t = f.getText('UTF-8')
                if (t.contains('GL_ARB_separate_shader_objects')) return
                def n = t.replaceFirst(/(#version \d+[^\n]*\n)/, '$1#extension GL_ARB_separate_shader_objects : require\n')
                def loc = ['in': 0, 'out': 0]
                n = n.replaceAll(/(?m)^((?:flat\s+)?)(in|out)\s+(\w+\s+\w+\s*;)/) { all, q, dir, rest -> "layout(location = ${loc[dir]++}) ${q}${dir} ${rest}" }
                if (ns != 'legoclient') n = n.replaceAll(/(?m)^#moj_import\s+/, '#include ')
                if (n != t) { f.setText(n, 'UTF-8'); shaders++ }
            }
        }
        println "shaders adapted for 26.3: ${shaders}"
    }
}

sourceSets {
    main {
        java.srcDirs = [new File(merged, 'java')]
        resources.srcDirs = [new File(merged, 'resources')]
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

tasks.named('compileJava') { dependsOn mergeSources }
tasks.named('processResources') {
    dependsOn mergeSources
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn mergeSources }

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
    it.options.compilerArgs += ['-Xmaxerrs', '5000']
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Prints the compile classpath (used by the API explorer workflow, mc-api.yml).
tasks.register('printClasspath') {
    def cp = sourceSets.main.compileClasspath
    doLast { cp.files.each { println "CP ${it}" } }
}
